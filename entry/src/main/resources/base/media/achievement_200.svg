<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 铂金牌 - 200天成就 -->
  <defs>
    <linearGradient id="platinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E4E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0A0A0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 奖牌主体 -->
  <circle cx="50" cy="55" r="35" fill="url(#platinum)" stroke="#A0A0A0" stroke-width="2"/>
  <!-- 奖牌内圈 -->
  <circle cx="50" cy="55" r="28" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  <!-- 数字200 -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#4169E1" text-anchor="middle">200</text>
  <!-- 奖牌顶部装饰 -->
  <path d="M30 20 Q50 10 70 20 L65 25 Q50 18 35 25 Z" fill="#E5E4E2" stroke="#A0A0A0" stroke-width="1"/>
  <!-- 钻石装饰 -->
  <polygon points="50,30 54,38 50,46 46,38" fill="#00CED1" filter="url(#glow)" opacity="0.9"/>
</svg>