<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 皇冠牌 - 1000天成就 -->
  <defs>
    <linearGradient id="crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 奖牌主体 -->
  <circle cx="50" cy="55" r="35" fill="url(#crown)" stroke="#FF4500" stroke-width="2"/>
  <!-- 奖牌内圈 -->
  <circle cx="50" cy="55" r="28" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
  <!-- 数字1000 -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1000</text>
  <!-- 奖牌顶部装饰 -->
  <path d="M30 20 Q50 10 70 20 L65 25 Q50 18 35 25 Z" fill="#FFD700" stroke="#FF4500" stroke-width="1"/>
  <!-- 皇冠装饰 -->
  <path d="M35 28 L40 22 L45 28 L50 20 L55 28 L60 22 L65 28 L65 35 L35 35 Z" fill="#FF4500" filter="url(#glow4)" opacity="0.95"/>
  <!-- 宝石装饰 -->
  <circle cx="50" cy="25" r="3" fill="#FF0000" opacity="0.9"/>
</svg>