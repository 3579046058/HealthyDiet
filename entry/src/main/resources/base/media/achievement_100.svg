<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 金牌 - 100天成就 -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 奖牌主体 -->
  <circle cx="50" cy="55" r="35" fill="url(#gold)" stroke="#FF8C00" stroke-width="2"/>
  <!-- 奖牌内圈 -->
  <circle cx="50" cy="55" r="28" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <!-- 数字100 -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">100</text>
  <!-- 奖牌顶部装饰 -->
  <path d="M30 20 Q50 10 70 20 L65 25 Q50 18 35 25 Z" fill="#FFD700" stroke="#FF8C00" stroke-width="1"/>
  <!-- 皇冠装饰 -->
  <polygon points="50,28 53,34 59,34 55,38 57,44 50,40 43,44 45,38 41,34 47,34" fill="#FF4500" opacity="0.9"/>
</svg>