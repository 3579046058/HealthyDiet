<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 钻石牌 - 365天成就 -->
  <defs>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B9F2FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00CED1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 奖牌主体 -->
  <circle cx="50" cy="55" r="35" fill="url(#diamond)" stroke="#008B8B" stroke-width="2"/>
  <!-- 奖牌内圈 -->
  <circle cx="50" cy="55" r="28" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
  <!-- 数字365 -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">365</text>
  <!-- 奖牌顶部装饰 -->
  <path d="M30 20 Q50 10 70 20 L65 25 Q50 18 35 25 Z" fill="#B9F2FF" stroke="#008B8B" stroke-width="1"/>
  <!-- 钻石装饰 -->
  <polygon points="50,28 56,38 50,48 44,38" fill="#FFFFFF" filter="url(#glow2)" opacity="0.95"/>
  <polygon points="50,32 54,38 50,44 46,38" fill="#E0FFFF" opacity="0.8"/>
</svg>