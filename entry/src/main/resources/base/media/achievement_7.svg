<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 铜牌 - 7天成就 -->
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 奖牌主体 -->
  <circle cx="50" cy="55" r="35" fill="url(#bronze)" stroke="#8B4513" stroke-width="2"/>
  <!-- 奖牌内圈 -->
  <circle cx="50" cy="55" r="28" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <!-- 数字7 -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
  <!-- 奖牌顶部装饰 -->
  <path d="M30 20 Q50 10 70 20 L65 25 Q50 18 35 25 Z" fill="#CD7F32" stroke="#8B4513" stroke-width="1"/>
  <!-- 星星装饰 -->
  <polygon points="50,30 52,36 58,36 53,40 55,46 50,42 45,46 47,40 42,36 48,36" fill="#FFD700" opacity="0.8"/>
</svg>